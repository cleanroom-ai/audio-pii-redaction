name: Deploy Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/cache@v6
        with:
          path: .cache/Xenova/whisper-tiny.en
          key: whisper-${{ hashFiles('models/README.md') }}
      - run: npm ci
      - run: npm run vendor
      - name: Check for the HF_TOKEN secret
        id: token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "::notice::HF_TOKEN is not set; skipping Space upload"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v7
        if: steps.token.outputs.ok == 'true'
        with:
          python-version: "3.15"
      - name: Upload Space
        if: steps.token.outputs.ok == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install --upgrade huggingface_hub
          python - <<'PY'
          from huggingface_hub import HfApi
          HfApi().upload_folder(
              repo_id="cleanroom-ai/audio-pii-redaction",
              repo_type="space",
              folder_path=".",
              ignore_patterns=["node_modules/**", ".cache/**", "tests/**", "scripts/**", ".github/**", "package.json", "package-lock.json", ".nvmrc", "_*.mjs"],
          )
          PY
